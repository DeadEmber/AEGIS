# Local/permanent paper-trading stack. No real execution exists in AEGIS.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: aegis
      POSTGRES_PASSWORD: ${AEGIS_DB_PASSWORD:-aegis-local-only}
      POSTGRES_DB: aegis
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aegis"]
      interval: 5s
      retries: 20

  migrate:
    build: .
    env_file: .env
    environment:
      AEGIS_DATABASE_URL: postgresql://aegis:${AEGIS_DB_PASSWORD:-aegis-local-only}@db:5432/aegis
    command: ["aegis", "db", "upgrade"]
    depends_on:
      db: {condition: service_healthy}

  worker:
    build: .
    env_file: .env
    environment:
      AEGIS_DATABASE_URL: postgresql://aegis:${AEGIS_DB_PASSWORD:-aegis-local-only}@db:5432/aegis
      AEGIS_EXECUTION_MODE: PAPER_TRADING
      AEGIS_ARCHIVE_DIR: /app/var/archive
    volumes: [archive:/app/var/archive]
    command: ["aegis", "run"]
    restart: unless-stopped
    depends_on:
      migrate: {condition: service_completed_successfully}

  api:
    build: .
    env_file: .env
    environment:
      AEGIS_DATABASE_URL: postgresql://aegis:${AEGIS_DB_PASSWORD:-aegis-local-only}@db:5432/aegis
    command: ["aegis", "api", "--host", "0.0.0.0", "--port", "8000"]
    ports: ["127.0.0.1:8000:8000"]
    restart: unless-stopped
    depends_on:
      migrate: {condition: service_completed_successfully}

  maintenance:  # run daily from the host scheduler: docker compose run --rm maintenance
    build: .
    env_file: .env
    environment:
      AEGIS_DATABASE_URL: postgresql://aegis:${AEGIS_DB_PASSWORD:-aegis-local-only}@db:5432/aegis
      AEGIS_ARCHIVE_DIR: /app/var/archive
      AEGIS_BACKUP_DIR: /backup
    volumes: [archive:/app/var/archive, "${AEGIS_HOST_BACKUP_DIR:-./backup}:/backup"]
    command: ["aegis", "maintenance"]
    profiles: [maintenance]
    depends_on:
      db: {condition: service_healthy}

volumes:
  pgdata:
  archive:
