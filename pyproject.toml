[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis"
version = "0.3.0"
description = "AEGIS — autonomous asymmetric crypto investment intelligence (paper-trading research platform)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
  "sqlalchemy>=2.0,<3",
  "alembic>=1.13",
  "pydantic>=2.6,<3",
  "pydantic-settings>=2.2",
  "httpx>=0.27",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "numpy>=1.26",
  "pyarrow>=15",
  "duckdb>=1.0",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
ml = ["scikit-learn>=1.4", "lightgbm>=4.3", "polars>=1.0", "duckdb>=1.0"]
dev = ["pytest>=8", "hypothesis>=6.100", "respx>=0.21", "ruff>=0.5"]

[project.scripts]
aegis = "aegis.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aegis = ["py.typed", "history/reference/*.json", "storage/migrations/*.ini", "storage/migrations/**/*.py", "storage/migrations/*.mako"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "live: hits real external APIs (deselected by default; run with -m live)",
  "postgres: requires AEGIS_TEST_POSTGRES_URL",
]

[tool.ruff]
line-length = 130
target-version = "py311"
extend-exclude = ["legacy", "web"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PL"]
ignore = ["PLR0913", "PLR0917", "PLR2004", "PLR0912", "PLR0915", "PLR0911", "RUF001", "RUF002", "RUF003", "PLC0415", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["RUF059", "E501"]
"src/aegis/storage/migrations/**" = ["E501", "I001"]
